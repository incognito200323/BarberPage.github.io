<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body class="login-cuerpo">
    <header id="header"></header>
    <main class="login-main">
        <div class="formulario-login">
            <img src="imagenes/WhatsApp-Image-2026-09-02-at-5.39.25-PM-_3_.webp" alt="">
            <h2>Inicio de sesion</h2>
                <form action="#" method="POST">
                    <div class="login-campo">
                        <label for="email">Correo Electronico o Usuario</label>        
                        <input type="text" id="email" name="email" placeholder="Email or username">
                    </div>
                    <div class="login-campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Password">
                    </div>
                    <div class="opciones-login">
                        <a href="#" class="contraseña">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="btn-login">Iniciar sesion</button>
                </form>
                <p class="registro-login">
                    ¿No tienes cuenta? <a href="#">Registrate</a>
                </p>    
        </div>
    </main>
    <footer id="footer"></footer>
</body>
<script src="js/metodos.js"></script>
</html>
