<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glow up barberia</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <header id="header"></header>
    <main class="cuerpo-main">
            <div class="imagen-contenedor">
                <img src="imagenes/Foto Main.webp" alt="" class="imagen-main">
            </div>

            <div class="Texto-main">
                <h1>Bienvenido A Barberia Glow Up</h1>
            </div>
    </main>
    <section class="galeria-fotos">
            <p>Fotos Referenciales</p>
            <p>Corte Varon</p>
            <div class="contenedor-galeria">
                <div class="tarjeta-servicio">
                    <img src="imagenes/imagen1.webp" alt="corte 1" class="img-servicio">
                    <div class="info-servicio">
                        <p id="precio1">$10.000</p>
                    </div>
                </div>
                <div class="tarjeta-servicio">
                    <img src="imagenes/imagen2.webp" alt="corte 2" class="img-servicio">
                    <div class="info-servicio">
                        <p id="precio2">$15.000</p>
                    </div>
                </div>
                <div class="tarjeta-servicio">
                    <img src="imagenes/imagen3.webp" alt="corte 3" class="img-servicio">
                    <div class="info-servicio">
                        <p id="precio3">$20.000</p>
                    </div>
                </div>
                <div class="tarjeta-servicio">
                    <img src="imagenes/imagen4.webp" alt="corte 4" class="img-servicio">
                    <div class="info-servicio">
                        <p id="precio4">$25.000</p>
                    </div>
                </div>
            </div>
    </section>
    <footer id="footer"></footer>
</body>
<script src="js/metodos.js"></script>
</html>
